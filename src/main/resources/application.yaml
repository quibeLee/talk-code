spring:
  application:
    name: talk-code
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/talk_code
    username: root
    password: 115712
  # redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      ttl: 3600
  # session 配置
  session:
    store-type: redis
    # session 过期时间 30天
    timeout: 2592000
  #读取本地环境配置
  profiles:
    active: local
server:
  port: 9011
  servlet:
    context-path: /api
    #Cookie 过期时间 30天
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi项目配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: [ '/**' ]
      packages-to-scan: [ 'com.talkcode.controller' ]
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

# AI 配置
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: <your-api-key>
      model-name: deepseek-v4-flash
      max-tokens: 16384
      log-requests: false
      log-responses: false
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <your-api-key>
      model-name: deepseek-v4-flash
      max-tokens: 16384
      log-requests: false
      log-responses: false
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <your-api-key>
      model-name: deepseek-v4-flash
      max-tokens: 32768
      temperature: 0.1
      log-requests: false
      log-responses: false
    # 简单任务 AI 模型配置（标题生成、代码生成类型路由等）
    simple-task-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: <your-api-key>
      model-name: qwen-turbo
      max-tokens: 100
      log-requests: false
      log-responses: false
cos:
    client:
      host: your-custom-domain.com
      secretId: your-secret-id
      secretKey: your-secret-key
      region: ap-shanghai
      bucket: your-bucket-name
# Pexels 图片搜索配置
pexels:
  api-key: your-secret-key
# 阿里云 DashScope 配置
dashscope:
  api-key: your-secret-key
  image-model: wan2.2-t2i-flash
# 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always



